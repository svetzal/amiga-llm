# Licensed Amiga media this environment needs, and where each item came from.
#
# The files themselves are copyrighted and live only in this directory, which
# git ignores except for this manifest and manifest.lock.json. `make media`
# copies them in once from the origin collection; after that nothing in the
# project reads the origin again. `make media-verify` checks every file against
# the checksums recorded in manifest.lock.json.
#
# origin  — path relative to the origin root (Stacey's "Amiga Retro" folder)
# dest    — path relative to media/
# licence — what entitles this copy

origin_root = "~/Library/CloudStorage/OneDrive-Personal/Amiga Retro"

# ---- Kickstart ROMs: AmigaOS 3.2 (purchased from Hyperion) -----------------

[[item]]
dest = "rom/3.2/kick-a500-a600-a2000.rom"
origin = "AmigaOS3.2CD/ROM/kickCDTVa1000a500a2000a600.rom"
licence = "AmigaOS 3.2 CD-ROM"

[[item]]
dest = "rom/3.2/kick-a1200.rom"
origin = "AmigaOS3.2CD/ROM/kicka1200.rom"
licence = "AmigaOS 3.2 CD-ROM"

[[item]]
dest = "rom/3.2/kick-a3000.rom"
origin = "AmigaOS3.2CD/ROM/kicka3000.rom"
licence = "AmigaOS 3.2 CD-ROM"

[[item]]
dest = "rom/3.2/kick-a4000.rom"
origin = "AmigaOS3.2CD/ROM/kicka4000.rom"
licence = "AmigaOS 3.2 CD-ROM"

# ---- Kickstart ROMs: classic releases (Amiga Forever 10 Plus) ---------------

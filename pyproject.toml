[project]
name = "amiga-llm"
version = "0.1.0"
description = "Environment and tooling for agentic language-model experiments on the Commodore Amiga"
requires-python = ">=3.12"
dependencies = [
    "amitools==0.9.0",
]

[project.scripts]
amiga-env = "amiga_env.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/amiga_env"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

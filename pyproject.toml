[project]
name = "amiga-llm"
version = "0.1.0"
description = "amiga-env: a per-project environment for agent-driven Commodore Amiga development (Amiberry, licensed media, vasm/vlink, boot floppies)"
requires-python = ">=3.12"
dependencies = [
    "amitools==0.9.0",
    "mido>=1.3.3,<2",
    "numpy>=2.5.4,<3",
]

[project.scripts]
amiga-env = "amiga_env.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/amiga_env"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

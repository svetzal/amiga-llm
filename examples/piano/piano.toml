# EXP-004, the expressive piano: the recipe for `amiga-env piano`.
# Paths are under media/ (sfz, midi) or the project (out). Both pieces and
# the piano come from [[download]] entries in media/manifest.toml.

sfz = "salamander/SalamanderGrandPianoV3_44.1khz16bit/SalamanderGrandPianoV3.sfz"
out = "runs/exp004"
player = "examples/piano/player.s"   # the 68000 player (`amiga-env piano-disk`)
credits = "examples/piano/Credits"   # the full notices, as `Credits` on the disk
catalogue = "maestro/maestro-v3.0.0/maestro-v3.0.0.csv"  # for `amiga-env piano-survey`

# Chip RAM for the samples, the larger score, the player's tables and the
# program, out of the A500's 512 KB; the rest is left to the system.
budget_bytes = 389120   # 380 KB
program_bytes = 8192    # an estimate until the 68000 player exists

# Paula volume = 64 * (velocity / 127) ** velocity_exponent, at least 1.
velocity_exponent = 1.5

# The player's screen plays by itself: after this many seconds with no input
# it plays piece 1, and this long after each piece ends, the next (after the
# last, the first). A choice plays that piece now and the rotation goes on
# from it; Space stops and holds the rotation until the next choice.
rotate_s = 15

# The Salamander velocity layer every key plays. 64 is the median velocity of
# the first two pieces; it is fixed so that adding a piece does not change the
# samples.
layer_velocity = 64

[samples]
spacing = 3
min_rate = 11025.0
max_rate = 27000.0
harmonics = 4.0
attack_bass_s = 1.4
attack_treble_s = 0.4
loop_s = 0.1
fade_s = 0.01

# The player's screen (screen.py): the title picture with the list drawn in.
# Rows and columns are lowres pixels of the 320x200 NTSC screen.
[screen]
master = "examples/piano/art/piano-title-master.png"
font = "examples/piano/font.txt"
list_box = [190, 8, 318, 152]     # left, top, right, bottom: the dark wall and floor
line_pitch = 11
attribution = ["Piano: A. Holm, CC BY 3.0", "MAESTRO, CC BY-NC-SA 4.0"]
attribution_gap = 14              # on the floor, below the bright line where floor meets wall
attribution_colour = "654"        # the picture's own dim brown, not register 13: never turns gold
signature = "svetzal"
signature_colour = "136"          # the picture's lighter blue; ink 1 pixel in from the right and bottom
text = "EDB"                      # register 13: the picture's ivory
highlight = "B95"                 # register 13 on the playing line: the picture's gold
voice_trace = "5BC"               # register 14: soft cyan
mix_trace = "DB8"                 # register 15: pale gold
scope_band = [0, 152, 320, 197]   # whole rows, restored from a copy each scope frame
scope_centre = 174
voice_scopes = [8, 50, 92, 134]
voice_scope_width = 36
mix_scope = [180, 108]            # left, width: ends at column 287, left of the signature

[screen.picture]
colours = 13
gamma = 0.8
bright_weight = 6.0
seed = 1
iterations = 40

# The audio filter's light, in the lower left corner (the signature is in the
# lower right): a small box in colour register 14 and a label beside it in the
# picture's dim brown ([screen] attribution_colour). Shared with the A3500
# recipe (its `pieces`). As the filter changes, the A3500 player sets register
# 14 to one of these colours (OCS hex); the A500 player, whose voice traces
# are register 14, changes it on the light's rows only, with its copper list.
[filter_light]
label = "filter"
on = "F42"    # while the filter is on (CIA-A bit 1 clear): a lit LED
off = "311"   # while it is off: an unlit LED

# The pieces, in list order (keys 1 to 9, then letters). Chosen with
# `amiga-env piano-survey`; see EXP-004, "More pieces". The titles are written
# here, not taken from MAESTRO's catalogue, which has slips: BWV 846 is in the
# Well-Tempered Clavier Book I (MAESTRO says WTC II), Haydn's says "in in".
# Schubert's "D. 962" is MAESTRO's and is not verified (see EXP-004).
[[piece]]
name = "nocturne-op9-2"
title = "Chopin  Nocturne Op. 9 No. 2"

# EXP-006, the A3500 piano: the recipe for `amiga-env piano3500`.
# A model of a 68030 player that mixes 16 voices of 16-bit samples in software
# into 14-bit stereo (EXP-005, software mixing on the A3500, way B).
# Paths are under media/ (sfz) or the project (out, pieces).

sfz = "salamander/SalamanderGrandPianoV3_44.1khz16bit/SalamanderGrandPianoV3.sfz"
out = "runs/exp006"
pieces = "examples/piano/piano.toml"   # EXP-004's ten pieces, from its recipe
player = "examples/piano3500/player.s"   # the 68030 player (`amiga-env piano3500-run`)
machine = "a3500"                        # the amiga.toml machine it runs on

# Fast RAM for the samples (with their loop pads), the tables and the
# largest score, out of the A3500's 16 MB; the rest is for the system, the
# player and its log.
budget_bytes = 12582912   # 12 MB

# Velocity layers kept from Salamander's 16, spread evenly by centre velocity.
layers = 8

# Voice volume of the loudest sample at velocity 127, at most 32,767 (a
# MULS.W operand). Chosen so that the loudest of the ten pieces (BWV 846)
# peaks at -1 dBFS: a render at 14,336 peaked at 20,737, and 14,336 * 29,205
# / 20,737 = 20,190 (EXP-006). The build reports how far past full scale 16
# adjacent keys struck at velocity 127 would go.
full_volume = 20190

# 0 puts every key in the middle (mono); 1 puts A0 hard left and C8 hard right.
pan_width = 0.5

[samples]
spacing = 3
min_rate = 11025.0
max_rate = 27965.0      # the mix rate: no root is stored faster than it plays
harmonics = 4.0
attack_bass_s = 2.8     # twice EXP-004's
attack_treble_s = 0.8
loop_s = 0.1
fade_s = 0.01
peak = 32700            # largest sample value after normalising, below 32767 for the dither

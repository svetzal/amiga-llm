# amiga-env project file for amiga-llm: Stacey's two target machines.
#
# AGENTS.md records both machines and where each fact came from. Each profile
# starts from Amiberry's quick-start model and sets only what differs on the
# real machine. Boot one with `make a500`, `make a3000` or
# `amiga-env <machine> [DISK.adf] [amiberry options]`.
#
# model      Amiberry quick-start model (--model)
# kickstart  Kickstart ROM, relative to media/
# disk       floppy for drive 0 when no DISK.adf is given, relative to media/
# settings   extra Amiberry settings, each passed as -s
# purpose    one line for `amiga-env --help`

# Demos, games and code that drives the hardware directly, and the
# performance contract. Amiberry's A500 model already matches the facts not
# yet read off the machine (68000, OCS, 512 KB chip plus 512 KB slow RAM,
# cycle-exact).
[machines.a500]
model = "A500"
kickstart = "rom/forever/amiga-os-120.rom"
disk = "adf/1.2/workbench.adf"
settings = ["ntsc=true"]
purpose = "boot the A500 (Kickstart 1.2, Workbench 1.2): demos, games, hardware"

# Desktop applications (C, MUI). Amiberry's A3000 model has no fast RAM; the
# real machine has 8 MB on the motherboard, per the configuration Stacey kept
# for it (media/reference/stock-a3000.uae).
[machines.a3000]
model = "A3000"
kickstart = "rom/3.2/kick-a3000.rom"
disk = "adf/3.2/Install3.2.adf"
settings = ["ntsc=true", "a3000mem_size=8"]
purpose = "boot the A3000 (Kickstart 3.2, Workbench 3.2): desktop applications"

# Stacey's A3500, the Commodore prototype that came before the A3000T: a
# 68030 at 25 MHz and a 68882, ECS, NTSC, Kickstart 2.04 in ROM, 2 MB chip
# RAM and 16 MB fast RAM on the motherboard (Stacey, 2026-11-07). Amiberry's
# A3000 model is the same design. Workbench 2.1 is the last release for
# Kickstart 2.04.
[machines.a3500]
model = "A3000"
kickstart = "rom/forever/amiga-os-204-a3000.rom"
disk = "adf/2.1/workbench.adf"
settings = ["ntsc=true", "a3000mem_size=16"]
purpose = "boot the A3500 prototype (Kickstart 2.04, Workbench 2.1, 16 MB fast)"

# The A3000 as a development machine: the system built from
# systems/a3000-dev.toml boots as DH0: (System:), and the project's work/
# folder is Work:. Build it with `make system`; boot it with `make a3000-dev`.
[machines.a3000-dev]
model = "A3000"
kickstart = "rom/3.2/kick-a3000.rom"
system = "a3000-dev"
volumes = { Work = "work" }
settings = ["ntsc=true", "a3000mem_size=8"]
purpose = "boot the A3000 development system (3.2, SAS/C, NDU 3.1, MUI) with Work:"

# The same development system on the A3000 as Stacey runs it: a Z3660
# accelerator, a 68060 at 50 MHz (set in its z3660cfg.txt), with the
# 68060's own FPU and MMU, 32-bit addressing, and fast RAM in Zorro III
# space. A 68060 cannot run cycle-exact in Amiberry, and cpu_compatible
# stays on unless cycle-exact is off. The Z3660's RAM size is not yet read
# off the board; 256 MB until it is. The Z3660's own drivers (SCSI, RTG,
# network) are not in the system; see EXP-003.
[machines.a3000-dev-060]
model = "A3000"
kickstart = "rom/3.2/kick-a3000.rom"
system = "a3000-dev"
volumes = { Work = "work" }
settings = [
  "ntsc=true", "a3000mem_size=8",
  "cpu_model=68060", "fpu_model=68060", "mmu_model=68060",
  "cpu_compatible=false", "cpu_24bit_addressing=false",
  "cycle_exact=false", "cpu_cycle_exact=false", "cpu_memory_cycle_exact=false",
  "z3mem_size=256",
]
purpose = "boot the A3000 development system on a 68060 with MMU and FPU, as with the Z3660"
